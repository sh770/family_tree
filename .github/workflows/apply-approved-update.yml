name: אישור עדכון לעץ המשפחה

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  apply-update:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: התקנת תלויות (כולל hebcal לסנכרון תאריכים)
        run: npm install --no-save

      - name: חילוץ ה-JSON Payload מגוף ה-Issue
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || '';
            const match = body.match(/```json\s*([\s\S]*?)```/);
            if (!match) {
              core.setFailed('לא נמצא בלוק JSON בגוף ה-issue');
              return;
            }
            fs.writeFileSync('batch.json', match[1].trim());
            core.info('ה-payload חולץ בהצלחה');

      - name: הטמעת העדכון בקובץ הנתונים
        id: apply
        continue-on-error: true
        run: node scripts/apply-update.mjs batch.json

      - name: קומיט ופוש של הנתונים המעודכנים
        if: steps.apply.outcome == 'success'
        run: |
          git config user.name "family-tree-bot"
          git config user.email "actions@github.com"
          git add data/family-tree.json
          git diff --cached --quiet && echo "אין שינויים" || git commit -m "עדכון מאושר מתוך issue #${{ github.event.issue.number }}"
          git push

      - name: תגובת הצלחה וסגירת ה-issue
        if: steps.apply.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ העדכון אושר והוטמע בעץ המשפחה החי.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: תגובת שגיאה במקרה כשלון
        if: steps.apply.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ קרתה שגיאה בהטמעת העדכון. נא לבדוק את תקינות ה-JSON, להסיר ולהוסיף שוב את התווית approved לאחר תיקון.'
            });
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'approved'
            }).catch(() => {});
